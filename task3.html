<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3 - Image Gallery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <a href="index.html" class="logo">Brbr</a>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="task1.html">Task 1</a>
                <a href="task2.html">Task 2</a>
                <a class="active" aria-current="page" href="task3.html">Task 3</a>
                <a href="task4.html">Task 4</a>
            </nav>
        </div>
    </header>
    <main class="gallery-page">
        <h1>Simple Image Gallery</h1>
        <section class="gallery" aria-label="Image gallery">
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
                <figcaption class="gallery-caption">Mountain Escape</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Green valley and mountain">
                <figcaption class="gallery-caption">Green Valley</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Lake beside mountains">
                <figcaption class="gallery-caption">Quiet Lake</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Sunlight in a forest">
                <figcaption class="gallery-caption">Forest Light</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="Blue ocean shore">
                <figcaption class="gallery-caption">Ocean Breeze</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=700&q=80" alt="Sunset over a field">
                <figcaption class="gallery-caption">Golden Sunset</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Mountain range at sunrise">
                <figcaption class="gallery-caption">Morning Peaks</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=700&q=80" alt="Green leaves close up">
                <figcaption class="gallery-caption">Fresh Leaves</figcaption>
            </figure>
            <figure class="gallery-item">
                <img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=700&q=80" alt="Trees in a forest">
                <figcaption class="gallery-caption">Into the Woods</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
